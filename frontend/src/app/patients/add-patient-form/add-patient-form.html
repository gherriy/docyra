<form class="add-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="fields">
    <label class="field">
      <span>Nom</span>
      <input formControlName="lastName" autocomplete="off" />
      @if (form.controls.lastName.touched && form.controls.lastName.invalid) {
        <small class="field-error">Le nom est obligatoire.</small>
      }
    </label>
    <label class="field">
      <span>Prénom</span>
      <input formControlName="firstName" autocomplete="off" />
      @if (form.controls.firstName.touched && form.controls.firstName.invalid) {
        <small class="field-error">Le prénom est obligatoire.</small>
      }
    </label>
  </div>

  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }

  <div class="actions">
    <button type="submit" class="btn-primary" [disabled]="saving()">
      {{ saving() ? 'Ajout en cours…' : 'Ajouter le patient' }}
    </button>
    <button type="button" class="btn-secondary" (click)="cancelled.emit()">Annuler</button>
  </div>
</form>
