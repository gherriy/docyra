spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:docyra}
spring.datasource.username=${POSTGRES_USER:docyra}
spring.datasource.password=${POSTGRES_PASSWORD:docyra}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
docyra.storage.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB