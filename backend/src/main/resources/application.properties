spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB:docyra}
spring.datasource.username=${POSTGRES_USER:docyra}
spring.datasource.password=${POSTGRES_PASSWORD:docyra}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
docyra.storage.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
docyra.ocr.datapath=/opt/homebrew/share/tessdata
docyra.ocr.language=fra
docyra.ocr.lib-path=/opt/homebrew/lib
docyra.account.email=secretariat@docyra.local
docyra.account.password=change-me
docyra.jwt.secret=dev-secret-a-changer-au-moins-32-caracteres
docyra.scan.base-url=${DOCYRA_SCAN_BASE_URL:http://localhost:4200}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB